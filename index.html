<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="FinLab — finance education for students breaking into investment banking, private equity, and credit. Concept-first lessons, live calculators, real deal cases.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; script-src 'self'; base-uri 'self'; form-action 'none';">
<title>FinLab — Finance Education Platform</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#mainArea">Skip to main content</a>

<div class="topbar">
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="sidebar">☰</button>
  <button class="logo" id="logoBtn" type="button">FinLab<span class="logo-badge">BETA</span></button>
  <nav class="top-nav" aria-label="Primary">
    <button class="top-nav-btn" data-page="home" type="button" aria-current="page">🏠 Home</button>
    <button class="top-nav-btn" data-page="learn" type="button">📚 Learn</button>
    <button class="top-nav-btn" data-page="practice" type="button">🔧 Practice</button>
    <button class="top-nav-btn" data-page="dealroom" type="button">💼 Deal Room</button>
    <button class="top-nav-btn" data-page="glossary" type="button">📖 Glossary</button>
  </nav>
  <div class="top-right">
    <div class="xp-badge"><span aria-hidden="true">⚡</span> <span id="xpCount">0</span> XP</div>
    <div class="streak-badge"><span aria-hidden="true">🔥</span> <span id="streakCount">1</span> day streak</div>
  </div>
</div>

<div class="disclaimer-bar">FinLab is an independent educational project, not affiliated with or endorsed by any bank, fund, or institution named in its lessons. Content is for learning purposes only and is not investment advice.</div>

<div class="workspace">
<div class="sidebar-scrim" id="sidebarScrim"></div>
<nav class="sidebar" id="sidebar" aria-label="Learning path">
  <div id="sidebarNav"></div>
  <div class="sidebar-footer">
    <div class="progress-label"><span>Overall Progress</span><span id="progressPct">0%</span></div>
    <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBarWrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</nav>

<main class="main" id="mainArea" tabindex="-1"></main>
</div><!-- end workspace -->

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
